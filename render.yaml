# Render blueprint. Import this from the Render dashboard (New > Blueprint)
# and point it at this repository, or create the service by hand with the
# same settings.
services:
  - type: web
    name: group2-hardware-inventory
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    # Continuous deployment (TD-16): deploy each new commit on main only
    # after its GitHub Actions checks pass (.github/workflows/ci.yml), so a
    # commit that fails the tests or the image build never goes live.
    autoDeployTrigger: checksPass
    envVars:
      # sync: false means Render prompts for the value and stores it as a
      # secret. The connection string must never be committed here.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: HaaSResourceManager
      # Signs the login session cookie (TD-02). Must be set and must be the
      # same in every gunicorn worker: without it each worker invents its
      # own random key, so a signed-in user looks signed out whenever a
      # request lands on the other worker, and everyone is signed out on
      # every restart. Render generates it once and keeps it.
      - key: SECRET_KEY
        generateValue: true
